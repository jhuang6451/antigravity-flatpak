name: Build Flatpak & Deploy Repository

on:
  push:
    branches:
      - master
    paths:
      - 'com.google.Antigravity.yaml'
      - 'antigravity.sh'
      - 'com.google.Antigravity.desktop'
      - 'com.google.Antigravity.metainfo.xml'
      - 'icons/**'
      - 'scripts/**'
      - 'web/**'
      - 'antigravity.flatpakref'
      - 'antigravity.flatpakrepo'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak & Export Repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    outputs:
      app_version: ${{ steps.get_version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Application Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'antigravity-hub/\K[0-9.]+(?=-)' com.google.Antigravity.yaml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract the application version from com.google.Antigravity.yaml"
            exit 1
          fi
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Antigravity version: ${VERSION}"

      - name: Install Runtime Dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build Flatpak Package & OSTree Repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: com.google.Antigravity.yaml
          bundle: com.google.Antigravity.flatpak
          build-bundle: true
          branch: stable
          repo-dir: repo
          cache: true
          arch: x86_64

      # The repo is built from scratch on every run, so there is no history to
      # diff against: skip static deltas and pruning. Clients still download
      # only the objects that changed.
      - name: Sign Repository (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          scripts/sign-repo.sh repo com.google.Antigravity stable
          if [ ! -f gpg-public.b64 ]; then
            flatpak build-update-repo repo
          fi
          tar -czf ostree-repo.tar.gz -C repo .

      - name: Upload Standalone Bundle
        uses: actions/upload-artifact@v5
        with:
          name: antigravity-bundle
          path: com.google.Antigravity.flatpak
          if-no-files-found: error

      - name: Upload OSTree Repository Archive
        uses: actions/upload-artifact@v5
        with:
          name: ostree-repo-archive
          path: |
            ostree-repo.tar.gz
            gpg-public.b64
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages & Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Standalone Bundle
        uses: actions/download-artifact@v5
        with:
          name: antigravity-bundle

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@v5
        with:
          name: ostree-repo-archive

      - name: Prepare Deployment Directory
        run: |
          mkdir -p deploy/repo deploy/icons
          tar -xzf ostree-repo.tar.gz -C deploy/repo/
          cp -a web/* deploy/
          cp icons/hicolor/512x512/apps/com.google.Antigravity.png deploy/icons/com.google.Antigravity.png
          cp icons/hicolor/512x512/apps/com.google.Antigravity.png deploy/icons/512x512.png

          # Work on copies so the files in git stay untouched
          mkdir -p dist
          cp antigravity.flatpakrepo antigravity.flatpakref dist/

          # If the repo was signed, embed the public key and turn verification on
          if [ -f gpg-public.b64 ]; then
            KEY=$(cat gpg-public.b64)
            for f in dist/antigravity.flatpakrepo dist/antigravity.flatpakref; do
              sed -i '/^gpg-verify=/d' "$f"
              echo "GPGKey=${KEY}" >> "$f"
            done
          fi

          cp dist/antigravity.flatpakrepo dist/antigravity.flatpakref deploy/
          cp dist/antigravity.flatpakrepo dist/antigravity.flatpakref deploy/repo/
          touch deploy/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create or Update GitHub Release
        run: |
          TAG="v${APP_VERSION}"
          cat > notes.md <<EOF
          ## Antigravity IDE v${APP_VERSION}

          Unofficial Flatpak build of Google Antigravity IDE.

          ### Install from the repository (receives updates)
          \`\`\`bash
          flatpak remote-add --if-not-exists antigravity https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/antigravity.flatpakrepo
          flatpak install antigravity com.google.Antigravity
          flatpak run com.google.Antigravity
          \`\`\`

          ### Install from a .flatpakref
          \`\`\`bash
          flatpak install antigravity.flatpakref
          \`\`\`

          ### Install the offline bundle
          \`\`\`bash
          flatpak install com.google.Antigravity.flatpak
          \`\`\`

          Built by GitHub Actions.
          EOF

          # Re-packaging the same upstream version must move the tag
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Antigravity IDE v${APP_VERSION}" \
            --notes-file notes.md \
            com.google.Antigravity.flatpak \
            ostree-repo.tar.gz \
            dist/antigravity.flatpakref \
            dist/antigravity.flatpakrepo
